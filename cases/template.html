<!doctype html>
<html lang="zh-CN" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#faf7f2">
  <title>案例模板｜LIANG 作品集</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="frame header-row">
      <a class="site-name" href="../index.html" lang="en">LIANG</a>
      <nav aria-label="主导航">
        <a href="../index.html#work" aria-current="true">作品</a>
        <a href="../about.html">关于</a>
      </nav>
    </div>
  </header>

  <main id="main" class="frame case-page">
    <div class="page-intro">
      <a class="back-link" href="../index.html#work">全部作品</a>
      <h1>项目名称</h1>
      <p>用一句话说清楚这个项目为谁解决了什么问题。</p>
    </div>

    <!--
      在此放最终界面、交互演示或原型链接。图片写有意义的 alt。
      案例完成后删除本页 noindex，更新 title，并从首页添加入口。
    -->
    <section class="content-row" aria-labelledby="role">
      <h2 id="role">我的角色</h2>
      <p>填写项目类型、团队分工和你实际负责的设计工作。</p>
    </section>
    <section class="content-row" aria-labelledby="problem">
      <h2 id="problem">背景与问题</h2>
      <p>描述真实使用场景，以及你通过什么材料了解了这个问题。</p>
    </section>
    <section class="content-row" aria-labelledby="decisions">
      <h2 id="decisions">设计决策</h2>
      <p>选一到两个关键决策，展示考虑过的方案和选择理由。</p>
    </section>
    <section class="content-row" aria-labelledby="outcome">
      <h2 id="outcome">验证与迭代</h2>
      <p>记录实际的反馈、改动和目前完成到的阶段。</p>
    </section>
  </main>

  <footer class="frame site-footer">
    <p>LIANG 的 UI 与交互设计作品集</p>
    <a href="../index.html#work">返回作品列表</a>
  </footer>
</body>
</html>
