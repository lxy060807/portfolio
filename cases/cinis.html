  <main id="main" class="frame case-page">
    <div class="page-intro">
      <a class="back-link" href="../index.html#work">全部作品</a>
      <h1>CINIS 自律打卡</h1>
      <p>一套把今日任务与角色成长放在一起的打卡界面。任务可以通过计时专注或快速打卡记录，完成后显示经验值与魂火反馈。</p>
    </div>

    <section class="case-demo" aria-labelledby="flow">
      <div class="demo-heading">
        <h2 id="flow">打卡流程</h2>
        <p>按步骤体验任务选择与打卡反馈。</p>
      </div>
      <div class="case-flow">
        <fieldset class="view-switch">
          <legend class="visually-hidden">选择打卡流程步骤</legend>
          <input class="visually-hidden" type="radio" name="cinis-step" id="step-tasks" checked>
          <label for="step-tasks">今日任务</label>
          <input class="visually-hidden" type="radio" name="cinis-step" id="step-mode">
          <label for="step-mode">选择方式</label>
          <input class="visually-hidden" type="radio" name="cinis-step" id="step-reward">
          <label for="step-reward">完成反馈</label>
        </fieldset>
        <div class="flow-panels">
          <figure class="flow-panel" data-step="tasks">
            <img src="../assets/cinis/tasks.png" alt="今日页显示角色进度、待完成任务和已完成任务" width="437" height="953">
            <figcaption>
              <strong>从今日任务开始</strong>
              <p>待办和已完成任务在同一张列表里。每项任务标注预计时长、经验值和魂火，方便在开始前了解任务要求。</p>
              <button class="flow-next" type="button" data-next-step="step-mode" hidden>打开任务选项</button>
            </figcaption>
          </figure>
          <figure class="flow-panel" data-step="mode">
            <img src="../assets/cinis/mode.png" alt="任务底部弹层提供点火专注、快速打卡和取消入口" width="440" height="954">
            <figcaption>
              <strong>选择计时专注或快速打卡</strong>
              <p>点开任务后，可以启动计时，也可以直接记录完成。界面明确提示快速打卡不计专注时长。</p>
              <button class="flow-next" type="button" data-next-step="step-reward" hidden>预览完成反馈</button>
            </figcaption>
          </figure>
          <figure class="flow-panel" data-step="reward">
            <img src="../assets/cinis/reward.png" alt="打卡成功弹窗显示任务名称、时长、经验值和魂火奖励" width="438" height="954">
            <figcaption>
              <strong>确认本次完成结果</strong>
              <p>成功弹窗先确认任务和时长，再显示获得的经验值和魂火。“继续”用于返回任务流程。</p>
              <button class="flow-next" type="button" data-next-step="step-tasks" hidden>返回今日任务</button>
            </figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="case-demo" aria-labelledby="onboarding">
      <div class="demo-heading">
        <h2 id="onboarding">启动与角色选择</h2>
        <p>从启动画面进入旅者、骑士、深渊三种角色选项。</p>
      </div>
      <div class="case-gallery case-gallery-screens">
        <figure><img src="../assets/cinis/splash.png" alt="以火焰和 CINIS 字样组成的启动界面" width="407" height="889" loading="lazy"><figcaption>启动页</figcaption></figure>
        <figure><img src="../assets/cinis/character.png" alt="角色选择界面并列展示旅者、骑士与已选中的深渊" width="533" height="1155" loading="lazy"><figcaption>角色选择</figcaption></figure>
      </div>
    </section>
