    <div class="page-intro">

      <h1>电竞椅设计</h1>
      <p>一款面向桌前游戏场景的高背座椅概念，以包覆式头枕和分区软包组织椅身的轮廓。</p>
    </div>

    <section class="case-demo" aria-labelledby="form">
      <div class="demo-heading">
        <h2 id="form">造型与姿态</h2>
        <p>从不同视角查看头枕、靠背、座垫和扶手的关系。</p>
      </div>
      <div class="case-gallery case-gallery-four">
        <figure><img src="../assets/chair/front.png" alt="从斜前方看带翼状头枕和分区靠背的座椅" width="298" height="408"><figcaption>斜前视角</figcaption></figure>
        <figure><img src="../assets/chair/side.png" alt="座椅侧面，展示扶手、靠背曲线和五爪底座" width="303" height="410"><figcaption>侧面轮廓</figcaption></figure>
        <figure><img src="../assets/chair/top.png" alt="从上方看座垫、扶手内侧及头枕" width="304" height="408"><figcaption>俯视布局</figcaption></figure>
        <figure><img src="../assets/chair/recline.png" alt="靠背向后倾斜时的座椅概念效果图" width="409" height="546"><figcaption>后倾姿态示意</figcaption></figure>
      </div>
    </section>

    <section class="case-demo" aria-labelledby="finish">
      <div class="demo-heading">
        <h2 id="finish">配色方案</h2>
        <p>用同一视角对照软包色块、缝线和织物纹理。</p>
      </div>
      <div class="case-gallery case-gallery-four">
        <figure><img src="../assets/chair/ivory.png" alt="米白色软包电竞椅配浅色织物" width="525" height="707" loading="lazy"><figcaption>米白</figcaption></figure>
        <figure><img src="../assets/chair/tan.png" alt="棕灰色软包电竞椅配暖棕色织物" width="531" height="707" loading="lazy"><figcaption>暖棕</figcaption></figure>
        <figure><img src="../assets/chair/graphite.png" alt="深灰色软包电竞椅配灰色织物" width="535" height="705" loading="lazy"><figcaption>深灰</figcaption></figure>
        <figure><img src="../assets/chair/olive.png" alt="橄榄绿软包电竞椅配浅棕色织物" width="530" height="706" loading="lazy"><figcaption>橄榄绿</figcaption></figure>
      </div>
    </section>

    <section class="case-demo" aria-labelledby="context">
      <div class="demo-heading">
        <h2 id="context">使用场景与支撑构想</h2>
        <p>图中标注展示拟支撑的身体部位。</p>
      </div>
      <div class="case-gallery case-gallery-pair">
        <figure><img src="../assets/chair/desk.png" alt="使用者侧坐在电竞椅上操作桌面的电脑" width="392" height="496" loading="lazy"><figcaption>桌前使用场景示意</figcaption></figure>
        <figure><img src="../assets/chair/support.png" alt="座椅场景图标注头颈、肩腰、臀部和大腿的概念支撑位置" width="466" height="585" loading="lazy"><figcaption>分区支撑概念图</figcaption></figure>
      </div>
    </section>
