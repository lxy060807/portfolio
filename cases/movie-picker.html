<!doctype html>
<html lang="zh-CN" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="盲盒选片 App 课程设计，从观影问答、开盒推荐到选择观看渠道。">
  <meta name="theme-color" content="#faf7f2">
  <title>盲盒选片 App｜LIANG 作品集</title>
  <link rel="stylesheet" href="../style.css">
  <script defer src="../interactions.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="frame header-row">
      <a class="site-name" href="../index.html" lang="en">LIANG</a>
      <nav aria-label="主导航">
        <a href="../index.html#work" aria-current="true">作品</a>
        <a href="../about.html">关于</a>
      </nav>
    </div>
  </header>

  <main id="main" class="frame case-page">
    <div class="case-opening">
      <div class="page-intro">
        <a class="back-link" href="../index.html#work">全部作品</a>
        <h1>盲盒选片 App</h1>
        <p>一项个人交互设计课程作品。面向“不知道看什么”的观影场景，App 先询问心情、可用时长和同行人数，再用开盒的方式推荐一部影片。</p>
      </div>

      <figure class="case-cover case-cover-screens case-cover-movie">
        <img src="../assets/movie-picker/question.png" alt="观影问答首题" width="750" height="1624">
        <img src="../assets/movie-picker/reveal.png" alt="盲盒影片推荐结果" width="750" height="1624" fetchpriority="high">
        <img src="../assets/movie-picker/channels.png" alt="影片观看渠道" width="750" height="1624">
      </figure>
    </div>

    <section class="case-demo" aria-labelledby="path">
      <div class="demo-heading">
        <h2 id="path">从问答到观影</h2>
        <p>选择一个步骤，查看对应的原型界面。</p>
      </div>
      <div class="case-flow">
        <fieldset class="view-switch">
          <legend class="visually-hidden">选择观影流程步骤</legend>
          <input class="visually-hidden" type="radio" name="movie-step" id="movie-question" checked>
          <label for="movie-question">观影问答</label>
          <input class="visually-hidden" type="radio" name="movie-step" id="movie-reveal">
          <label for="movie-reveal">开盒揭晓</label>
          <input class="visually-hidden" type="radio" name="movie-step" id="movie-channels">
          <label for="movie-channels">观看渠道</label>
        </fieldset>
        <div class="flow-panels">
          <figure class="flow-panel" data-step="question">
            <img src="../assets/movie-picker/question.png" alt="观影问答第一题，用户可以选择当前的心情" width="750" height="1624">
            <figcaption>
              <strong>先了解这次观影的条件</strong>
              <p>逐步收集观影心情、剩余时间和同行人数，为这一次推荐缩小范围。</p>
              <button class="flow-next" type="button" data-next-step="movie-reveal" hidden>查看开盒结果</button>
            </figcaption>
          </figure>
          <figure class="flow-panel" data-step="reveal">
            <img src="../assets/movie-picker/reveal.png" alt="开盒后显示影片海报、推荐理由和换一部入口" width="750" height="1624">
            <figcaption>
              <strong>揭晓推荐，也可以换一部</strong>
              <p>结果页集中呈现一部影片、推荐理由与评分。想再比较时，可以换一部或查看影片详情。</p>
              <button class="flow-next" type="button" data-next-step="movie-channels" hidden>查看观看渠道</button>
            </figcaption>
          </figure>
          <figure class="flow-panel" data-step="channels">
            <img src="../assets/movie-picker/channels.png" alt="观看渠道页面，列出流媒体平台和影院选项" width="750" height="1624">
            <figcaption>
              <strong>把选片结果接到观看方式</strong>
              <p>渠道页区分流媒体和影院。课程原型还串联了场次、选座、确认订单和支付反馈。</p>
              <button class="flow-next" type="button" data-next-step="movie-question" hidden>返回观影问答</button>
            </figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="case-demo" aria-labelledby="questions">
      <div class="demo-heading">
        <h2 id="questions">问答与开盒过程</h2>
        <p>将筛选条件分步呈现，再进入揭晓动画。</p>
      </div>
      <div class="case-gallery case-gallery-three">
        <figure><img src="../assets/movie-picker/duration.png" alt="第二题询问今晚可用于看电影的时间" width="750" height="1624" loading="lazy"><figcaption>观影时长</figcaption></figure>
        <figure><img src="../assets/movie-picker/company.png" alt="第三题询问是独自观影还是结伴观看" width="750" height="1624" loading="lazy"><figcaption>同行人数</figcaption></figure>
        <figure><img src="../assets/movie-picker/shake.png" alt="开盒揭晓前的礼盒动画界面" width="750" height="1624" loading="lazy"><figcaption>开盒等待</figcaption></figure>
      </div>
    </section>

    <section class="case-demo" aria-labelledby="states">
      <div class="demo-heading">
        <h2 id="states">空状态与异常处理</h2>
        <p>给暂无内容、网络异常和找不到片源的场景提供后续操作。</p>
      </div>
      <div class="case-gallery case-gallery-three">
        <figure><img src="../assets/movie-picker/empty.png" alt="片单为空时引导用户去开一个盲盒" width="750" height="1624" loading="lazy"><figcaption>片单为空</figcaption></figure>
        <figure><img src="../assets/movie-picker/offline.png" alt="网络异常时提供重试和返回选项" width="750" height="1624" loading="lazy"><figcaption>网络异常</figcaption></figure>
        <figure><img src="../assets/movie-picker/unavailable.png" alt="找不到在线播放渠道时显示其他选择" width="750" height="1624" loading="lazy"><figcaption>暂无片源</figcaption></figure>
      </div>
    </section>
  </main>

  <footer class="frame site-footer">
    <a href="../index.html#work">返回作品列表</a>
    <a href="cinis.html">查看 CINIS 自律打卡</a>
  </footer>
</body>
</html>
